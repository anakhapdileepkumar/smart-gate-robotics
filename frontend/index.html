<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Gate Dashboard</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding-top: 100px;
    }

    .dashboard {
      background: white;
      width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }

    h1 {
      color: #333;
    }

    #status {
      font-size: 24px;
      margin: 20px;
      color: red;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <div class="dashboard">

    <h1>Smart Gate Dashboard</h1>

    <p id="status">Gate Closed</p>

    <button onclick="openGate()">Simulate Vehicle Detection</button>

  </div>

  <script>

    function openGate() {

      document.getElementById("status").innerText = "Gate Opening...";

      setTimeout(() => {
        document.getElementById("status").innerText = "Gate Open";
      }, 2000);

      setTimeout(() => {
        document.getElementById("status").innerText = "Gate Closed";
      }, 7000);
    }

  </script>

</body>
</html>
